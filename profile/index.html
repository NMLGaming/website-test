<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Website Test</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ===== Navigation ===== -->
  <nav>
    <a class="nav-logo" href="/">Website Test</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Mở menu" aria-expanded="false">
      <span></span><span></span><span></span>

    <ul class="nav-links" id="nav-links">
      <li><a href="/">Trang chủ</a></li>
      <li><a href="/home">Home</a></li>
      <li><a href="/leaderboard">Leaderboard</a></li>
      <li><a href="/profile">Profile</a></li>
    </ul>
  </nav>

  <!-- ===== Main Content ===== -->
  <main>
    <div class="card">
      <h2>👤 Profile</h2>
      <ul class="info-list">
        <li>
          <span class="info-label">Player</span>
          <span class="info-value">Steve</span>
        </li>
        <li>
          <span class="info-label">Level</span>
          <span class="info-value">100</span>
        </li>
        <li>
          <span class="info-label">Coins</span>
          <span class="info-value">999,999</span>
        </li>
      </ul>
      <div class="btn-group">
        <a class="btn btn-secondary" href="/">← Quay về Trang chủ</a>
      </div>

  <!-- ===== Footer ===== -->
  <footer>
    <p>Website Test &mdash; HTML / CSS / JS thuần</p>

  <script src="/script.js"></script>
