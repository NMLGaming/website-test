<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — VIELIST</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body class="admin-body">

  <!-- ===== Login Screen ===== -->
  <div id="login-screen">
    <div class="a-login-wrap">
      <div class="glass-card a-login-card">
        <div class="a-login-brand">🛡️</div>
        <h1>VIELIST Admin</h1>
        <p>Đăng nhập để quản lý hệ thống</p>
        <form id="a-login-form" autocomplete="on">
          <div class="form-group">
            <label for="a-user-input">Tên đăng nhập</label>
            <input type="text" id="a-user-input" placeholder="Nhập username…" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="a-pass-input">Mật khẩu</label>
            <input type="password" id="a-pass-input" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <button class="btn btn-primary btn-full" type="submit" id="a-login-btn">Đăng nhập</button>
          <p class="a-login-error" id="a-login-error"></p>
        </form>
        <div class="a-back-link"><a href="/">← Về trang chủ</a></div>
      </div>
    </div>
  </div>

  <!-- ===== Admin Shell ===== -->
  <div id="admin-shell" class="a-shell" hidden>

    <!-- Topbar -->
    <header class="a-topbar">
      <button class="a-sidebar-toggle" id="a-sidebar-toggle" aria-label="Toggle menu">☰</button>
      <div class="a-brand">🛡️ <strong>VIELIST</strong> <span class="a-brand-sub">Admin</span></div>
      <div class="a-topbar-right">
        <span class="a-username-badge" id="a-username-badge"></span>
        <a href="/" target="_blank" class="btn btn-ghost btn-sm">🌐 Website</a>
        <button id="a-logout-btn" class="btn btn-danger btn-sm">🚪 Đăng xuất</button>
      </div>
    </header>

    <div class="a-layout">
      <!-- Sidebar -->
      <aside class="a-sidebar" id="a-sidebar">
        <nav class="a-nav">
          <button class="a-nav-item" data-section="dashboard">
            <span class="a-nav-icon">📊</span><span class="a-nav-label">Dashboard</span>
          </button>
          <div class="a-nav-sep">Nội dung</div>
          <button class="a-nav-item" data-section="announcements">
            <span class="a-nav-icon">📣</span><span class="a-nav-label">Thông báo</span>
          </button>
          <div class="a-nav-sep">Servers</div>
          <button class="a-nav-item" data-section="is7mc">
            <span class="a-nav-icon">🌐</span><span class="a-nav-label">IS7MC</span>
          </button>
          <button class="a-nav-item" data-section="kingmc">
            <span class="a-nav-icon">🏰</span><span class="a-nav-label">KINGMC</span>
          </button>
          <div class="a-nav-sep">Quản lý</div>
          <button class="a-nav-item" data-section="players">
            <span class="a-nav-icon">👤</span><span class="a-nav-label">Players</span>
          </button>
          <button class="a-nav-item" data-section="settings">
            <span class="a-nav-icon">⚙️</span><span class="a-nav-label">Settings</span>
          </button>
        </nav>
      </aside>

      <!-- Content Area (all sections rendered here by admin.js) -->
      <main class="a-content">
        <div id="a-section-root"></div>
      </main>
    </div>
  </div>

  <!-- ===== Generic Modal ===== -->
  <div class="a-modal-overlay" id="a-modal">
    <div class="modal-box a-modal-box">
      <h3 id="a-modal-title"></h3>
      <div id="a-modal-body"></div>
      <div class="modal-actions" id="a-modal-actions">
        <button type="button" class="btn btn-ghost" id="a-modal-cancel">Hủy</button>
        <button type="button" class="btn btn-primary" id="a-modal-save">Lưu</button>
      </div>
    </div>
  </div>

  <!-- ===== Confirm Dialog ===== -->
  <div class="a-modal-overlay" id="a-confirm">
    <div class="modal-box" style="max-width:360px;text-align:center">
      <div style="font-size:2.2rem;margin-bottom:.5rem">⚠️</div>
      <h3 id="a-confirm-title">Xác nhận xóa</h3>
      <p id="a-confirm-msg" style="color:var(--text-sm);font-size:.88rem;margin-top:.5rem"></p>
      <div class="modal-actions" style="justify-content:center;margin-top:1.5rem">
        <button class="btn btn-ghost" id="a-confirm-cancel">Hủy</button>
        <button class="btn btn-danger" id="a-confirm-ok">Xóa</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/assets/js/admin-api.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
