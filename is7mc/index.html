<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IS7MC.NET — PvP rankings | VIELIST</title>
  <meta name="description" content="Bảng xếp hạng Top PvP và King chính thức của IS7MC.NET trên VIELIST." />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ===== Nav ===== -->
  <nav>
    <a class="nav-logo" href="/">VIELIST</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="/"><span class="nav-dot"></span>Home</a></li>
      <li><a href="/is7mc" class="active"><span class="nav-dot"></span>IS7MC</a></li>
      <li><a href="/kingmc"><span class="nav-dot"></span>KINGMC</a></li>
    </ul>
    <div class="nav-auth" id="nav-auth"></div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ===== Main ===== -->
  <main>
    <div class="page-header">
      <span class="section-kicker">THE COMPETITIVE SERVER</span>
      <h1>IS7MC<span class="accent">.NET</span></h1>
      <p>Bảng xếp hạng chính thức của server <span class="accent">IS7MC.NET</span> — nơi kỹ năng tạo nên thứ hạng.</p>
    </div>

    <!-- Tabs -->
    <div class="lb-tabs">
      <button class="lb-tab active" data-tab="pvp">⚔️ Top PvP</button>
      <button class="lb-tab" data-tab="king">👑 King IS7MC</button>
    </div>

    <!-- Tab: PvP -->
    <div class="tab-panel active" id="tab-pvp">
      <div class="lb-search-wrap">
        <span class="lb-search-icon">🔎</span>
        <input id="search-pvp" class="lb-search-input" type="text"
          placeholder="Tìm kiếm player PvP…" autocomplete="off" />
      </div>
      <div id="board-pvp"></div>
    </div>

    <!-- Tab: King -->
    <div class="tab-panel" id="tab-king">
      <div class="lb-search-wrap">
        <span class="lb-search-icon">🔎</span>
        <input id="search-king" class="lb-search-input" type="text"
          placeholder="Tìm kiếm player King…" autocomplete="off" />
      </div>
      <div id="board-king"></div>
    </div>
  </main>

  <footer>
    <p><strong>© 2026 VIELIST</strong> &mdash; Minecraft Leaderboard &mdash;
      <a href="/is7mc">IS7MC.NET</a> &bull; <a href="/kingmc">KINGMC.VN</a>
    </p>
  </footer>

  <button id="back-top" title="Lên đầu trang">↑</button>
  <div id="toast-container"></div>

  <script>window.LB_SERVER = 'is7mc';</script>
  <script src="/assets/js/data.js"></script>
  <script src="/script.js"></script>
  <script src="/assets/js/auth-nav.js"></script>
  <script src="/assets/js/leaderboard.js"></script>
</body>
</html>
